name: Live sandbox verification

# Explicit release check, never run for every pull request. Uses only the
# provider's documented fictional card data; no repository payment secrets.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: live-sandbox-verification
  cancel-in-progress: false

jobs:
  sandbox:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'verify-live-sandbox'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify live API before submitting sandbox cards
        run: node scripts/smoke-cloud.mjs https://j67vc6cdn4.execute-api.us-east-1.amazonaws.com
      - name: Verify genuine sandbox approval and decline
        run: node scripts/smoke-sandbox.mjs https://j67vc6cdn4.execute-api.us-east-1.amazonaws.com --run-sandbox
      - name: Preserve sanitized live evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-sandbox-evidence
          path: test-results/live-sandbox/
          retention-days: 14
          if-no-files-found: warn
